steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/go-mongo-generic-sample:$COMMIT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/go-mongo-generic-sample:$COMMIT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'go-mongo-generic-sample'
      - '--image'
      - 'gcr.io/$PROJECT_ID/go-mongo-generic-sample:$COMMIT_SHA'
      - '--region'
      - 'us-central1' # Change to your preferred region
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-secrets'
      - 'MONGO_URI=mongodb+srv://dbUser:Demoaccount1@projectdemo.g0lah.mongodb.net'
      - '--set-env-vars'
      - 'MONGO_DATABASE=masterdata'
images:
  - 'gcr.io/$PROJECT_ID/go-mongo-generic-sample:$COMMIT_SHA'
